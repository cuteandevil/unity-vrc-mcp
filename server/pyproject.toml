[project]
name = "unity-vrc-mcp-server"
version = "0.1.0"
description = "MCP server bridging agent CLIs to a Unity Editor running the VrcMcp plugin (VRChat avatar editing)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "websockets>=12.0",
    "psutil>=5.9",
]

[project.scripts]
unity-mcp-server = "unity_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unity_mcp_server"]